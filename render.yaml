services:
  - type: web
    name: mentra-brain-worker
    runtime: node
    rootDir: brain-worker
    buildCommand: npm ci
    startCommand: npm start
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: MENTRA_BASE_URL
        value: https://mentra.inkthreadhub.in
      - key: BRAIN_WORKER_PRIVATE_KEY_B64
        sync: false
      - key: MENTRA_USER_ID
        sync: false
      - key: WHATSAPP_SELF_CHAT
        value: "true"
      - key: WHATSAPP_AUTH_STORE
        value: remote
      - key: PORT
        value: 10000
