services:
  - type: web
    name: mentra-brain-worker
    runtime: node
    rootDir: brain-worker
    buildCommand: npm ci
    startCommand: npm start
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: MENTRA_BASE_URL
        value: https://mentra.inkthreadhub.in
      - key: BRAIN_WORKER_PRIVATE_KEY_B64
        sync: false
      - key: MENTRA_USER_ID
        sync: false
      - key: WHATSAPP_SELF_CHAT
        value: "true"
      - key: WHATSAPP_AUTH_STORE
        value: remote
      - key: PORT
        value: 10000
      # Direct AI fallback when the Vercel backend is unreachable
      - key: GEMINI_API_KEY
        sync: false
      # Direct Supabase fallback for status/heartbeat when the API fails
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      # Optional: comma-separated numbers (with country code) allowed besides self-chat
      - key: WHATSAPP_ALLOWED_NUMBERS
        sync: false
      # Accept messages up to 10 min old (queued while reconnecting)
      - key: MAX_MESSAGE_AGE_MS
        value: "600000"
