name: MENTRA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          AI_PROVIDER: fallback
          AI_AGENT_RUNTIME_V2: "false"
          AI_MEMORY_V2: "false"
          AI_MEMORY_AUTO_EXTRACT: "false"
          AI_MEMORY_DEDUP_V2: "false"
          AI_TRACE_LEARNING: "false"
